explain_multisite: 'Allows you to manage an additional level. Domains are attached to sites.'
explain_restore: 'In the event of loss of data or a problem with the GRR database, this function allows you to find it in the previous state of a backup. You must select a file created using the "Start a backup function".'
explain_session_max_length: 'This duration indicates the maximum time of inactivity at the end of which a user is automatically disconnected.'
explication_champs_additionnels: 'On this page, you have the possibility of defining, area by area, additional fields of your choice and which will appear in the input forms of the reservations as so many more optional fields.'
