explication_Jours_Cycles1: 'The following parameters are used during the creation or the regeneration of the calendar of "cycle days". If you modify parameters on this page, they will be considerated only if you create or regenerate the calendar "cycle days".'
explication_Jours_Cycles2: 'When the calendar is generated, you can modify manually the occupancy of the cycle days for each date of the calendar'
