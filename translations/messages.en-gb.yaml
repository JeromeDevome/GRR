Explications_des_Parametres_configuration_envoi_automatique_mails: 'GRR uses PHPMailer for the sending of mails. With PHPMailer, there are two methods to send mails: 1) The "smtp" method allowing to connect to a remote server of mail; 2)The "mail" method when the server of mail is local. The "smtp" method can be also used with a local server but it''s better to privilege the "mail" method with a local server because it is faster.'
