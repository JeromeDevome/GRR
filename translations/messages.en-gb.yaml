execution_automatique_backup_explications: 'An automatic backup can be triggered by the execution of the script "admin_save_mysql.php", for example, by scheduling its execution using a "cron" task. To enable this feature, you must define a password below. For example, if the password is jamesbond007, the URL of the type: http://my-site.com/grr/admin_save_mysql.php?password=jamesbond007 will trigger the backup. It is strongly recommended to choose a complex password with letters, numbers, and special characters!'
