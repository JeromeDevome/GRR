admin_calendar_explain_1: 'This procedure allows you to quickly reserve or release time slots simultaneously across multiple resources in several domains and according to a calendar. For example, you can block out certain days throughout the year, such as weekends, holidays, and public holidays. Warning: If there is a conflict with existing reservations, these will be automatically and permanently deleted in favor of the new reservation. Furthermore, those affected by the deletions will not be notified by email. This procedure takes place in three steps: 1. Selection of the domain(s) and the type of action; 2. Selection of the resources to reserve, name, description, and type of reservation; 3. Selection of the dates and times to reserve on a calendar. The actual changes to the reservations only occur after the third step.'
