explain_automatic_mail: 'In some instances (creation of a reservation, suppression/modification, moderation), GRR can send automatically e-mails to some users. Consult the help to know more about it. Do you wish to use this option? '
explain_automatic_mail1: 'When a user reserves a resource, , modifies or deletes a reservation for himself (which he is beneficiary), tick the box opposite in order to send systematically an email of confirmation.'
explain_automatic_mail2: 'Besides, when a user reserves a resource, modifies or deletes a reservation, some users may be informed by e-mail. For each resource, you can select one or several users who will be informed of the change:'
explain_automatic_mail3: ' When a user reserves a resource, modifies or deletes a reservation in the name of another user, the latter (if the field e-mail was filled in) is automatically warned by e-mail.'
explain_backup: 'Creation of a complete backup file of GRR database.In case of a problem on GRR database, use a tool such as PHPMYADMIN to restore database.'
explain_champs_recherche: 'In the case of HTTP authentication, it is possible to attempt to retrieve the names, first names and email addresses of the users using the information contained in the \S_SERVER table and transmitted by the authentication system. For example, if \S_SERVER["sn"] contains the name of the user, indicate "sn" in the first field below. Likewise indicate "givenName" in the second line if \S_SERVER["givenName"] contains the first name and indicate "mail" in the third line if \S_SERVER["mail"] contains the mail.'
