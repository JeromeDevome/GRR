explain_default_parameter: 'From this rubric, select the display by default of the homepage. These are the parameters which will be applied if users themselves have not selected display parameters by default.'
explain_disable_login: 'When connections are disabled, users -apart from administrators- can no longer connect to the site. Moreover, users currently connected will be automatically disconnected. Nevertheless, if connection is not obligatory for the access to the site in visualization, this access remains possible.'
explain_horaire_autorise: 'You can restrict the connection to GRR between certain times. Leave blank to not restrict the connection to times or enter the allowed time range (HH:MM format). Administrators are not impacted by this restriction.'
