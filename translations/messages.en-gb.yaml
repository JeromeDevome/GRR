admin_import_users_csv2: ' Imported file is to be in CSV format (delimiter: semicolon) The Last Name or First Name fields can include accents, the file must be encoded in UTF-8 format. The file must contain the following fields: --> Login: login-name --> Name --> First name --> Password --> Email address (optional) --> User type: four authorized values: visiteur (visitor), utilisateur (user), administrateur (administrator), gestionnaire_utilisateur (user administrator) --> Status: two authorized values: "active" or "inactive" --> Type of authentification : two authorized values: "local" or "ext" --> Password change at next connection: two authorized values: 0 = no or 1 = yes '
admin_import_users_csv3: ' SOME PRECISIONS: Login-name Maximum of 40 characters. It can only contain letters, numbers and underscore (_). If this format is not followed, the following string ??? will appear instead of the login name. Existing accounts are displayed in red. Existing data will be replaced during importation! Name User''s name. Maximum 30 characters. It can only contain letters, numbers, spaces and single quotes First name User''s first name. Same restrictions as the name. First and last names that match an existing account will be displayed in blue. Password Leave empty if authentification type is "ext". %pass_leng% characters minimum and 30 characters maximum. Email address 100 characters maximum. Authentification type "local" in most cases and "ext" in external auth system such as LDAP, CAS, etc. '
