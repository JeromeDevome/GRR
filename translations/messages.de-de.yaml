admin_purge_accounts: 'Löschen von Konten und zugehörigen Reservierungen'
admin_purge_accounts_confirm: 'ACHTUNG: Durch diese Aktion werden alle Benutzer (außer den allgemeinen Administratoren) außerhalb von GRR und deren Berechtigungen gelöscht. Die mit diesen Konten verbundenen Reservierungen werden nicht gelöscht. Möchten Sie diese Aktion wirklich ausführen?'
admin_purge_accounts_confirm2: 'ACHTUNG: Diese Aktion löscht alle Benutzer (außer Generaladministratoren) außerhalb von GRR und deren Berechtigungen sowie alle damit verbundenen Reservierungen (vergangene und zukünftige). Möchten Sie diese Aktion wirklich ausführen?'
admin_purge_accounts_confirm4: 'ACHTUNG: Diese Aktion löscht alle externen Benutzer von GRR, mit Ausnahme der allgemeinen Administratoren und Benutzer mit Sonderrechten. Die mit diesen Konten verbundenen Reservierungen werden nicht gelöscht. Möchten Sie diese Aktion wirklich ausführen?'
admin_purge_accounts_desc: 'Mit den folgenden Aktionen können Sie alle Benutzerkonten, die über eine externe Quelle zu GRR hinzugefügt wurden und keine allgemeinen Administratoren sind, sowie, je nach gewählter Option, alle zugehörigen Reservierungen löschen. Achtung, diese Aktionen sind irreversibel. Seien Sie sich daher sicher, dass Sie diese Löschung durchführen möchten. Erstellen Sie zuvor eine Sicherungskopie der Datenbank Hinweis: Führen Sie diesen Vorgang nur durch, wenn kein Benutzer (außer dem Administrator) bei GRR angemeldet ist. Zur Erinnerung: Sie können die Verbindungen zu GRR vorübergehend deaktivieren (Menü "Allgemeine Konfiguration").'
