admin_corresp_statut_desc: 'Auf dieser Seite kann der Administrator die Zuordnungen zwischen dem Profil des Benutzers im LDAP-Verzeichnis (seiner Funktion) und dem Status, der ihm bei seiner ersten Anmeldung bei GRR innerhalb von GRR zugewiesen wird, festlegen. Damit diese Funktion verfügbar ist, müssen Sie auch Ihren CAS-Server und die Datei config_CAS.inc.php von GRR konfigurieren. Hinweis: Diese Aktion hat keine Auswirkungen auf Benutzer, die bereits in der GRR-Datenbank vorhanden sind (siehe Dokumentation).'
