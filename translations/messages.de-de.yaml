admin_calendar_explain_1: 'Diesen Vorgang erlauben Sie eine schnelle und gleichzeitige Änderung von Zeitabstände für mehrere Domäne und Ressourcen (reservieren oder aufheben), gemäss einen bestimmten Zeitplan. Zum Beispiel : Dadurch können Sie bestimmte Tage (wie Wochenende, Urlaub, Freitage) für das ganze Jahr lang blockieren. Achtung : Wenn diesen Vorgang mit schon gemachten Reservierungen im Konflikt steht, werden sie automatisch und endgültig gelöscht, zugunsten dieses Vorgangs. Ausserdem werden die Benutzer per email nicht davon informiert. Der Vorgang findet in drei Phasen statt : Wahl der Domäne(n) und Aktionstyp Wahl der Ressourcen, Name, Beschreibung und Reservierungsart Wahl der Daten und Uhrzeiten auf einem Zeitplan Die Änderungen werden nur am Ende der Phase 3 in Betracht gezogen.'
