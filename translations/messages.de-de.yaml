admin_import_users_csv2: ' Die Importdatei muss im CSV-Format sein (Trennzeichen: Semikolon, Zeichensatz: UTF-8) Die Datei muss folgende unterschiedliche Felder enthalten: --> Identifizierungscode: der Identifizierungscode des Benutzers --> Name --> Vorname --> Passwort --> E-Mail-Adresse (fakultativ) --> Benutzertyp : drei zulässige Werte : "visiteur" (Besucher), "utilisateur" (Benutzer), "administrateur" (Administrator) --> Status : zwei zulässige Werte : "actif" (activ) oder "inactif" (inaktiv) --> Authentifizierungsart : zwei zulässige Werte : "local" oder "ext" --> Passwortänderung bei nächster Verbindung: zwei Werte erlaubt: "0" = "nein" oder "1" = "ja" '
admin_import_users_csv3: ' EIN PAAR ERLÄUTERUNGEN: Identifizierungscode 20 Zeichen maximal. Jede beliebige Zeichen- oder Ziffernfolge ist möglich. Das Zeichen _ ist ebenfalls zulässig. Sollte das Format nicht respektiert werden, erscheint die Zeichenfolge ??? anstelle des Identifizierungscodes. Die rot erscheinenden Identifizierungscodes entsprechen den Benutzernamen, die bereits in der GRR-Basis existieren. Die existierenden Daten werden also vernichtet und durch die in der Importdatei vorhandenen ersetzt! Name Benutzername. 30 Zeichen maximal. Jede beliebige Zeichen- oder Ziffernfolge sind möglich mit eventuell Leerstellen und Apostrophen. Vorname Vorname des Benutzers. Siehe Bemerkung für den Namen. Die blau erscheinenden Namen und Vornamen entsprechen den in der GRR-Basis existierenden Benutzern, welche dieselben Namen und Vornamen tragen. Passwort leer bleiben, falls der Authentifizierungsart ist "ext".%pass_leng% Zeichen mindestens und 30 Zeichen maximal. E-Mail-Adresse 100 Zeichen maximal. Authentifizierungsart Tippen "local" für Standardsfall und "ext" für einen Benutzer, der sich durch LDAP oder ein SSO System (CAS, Lemonldap, usw) identifizert, ein. '
admin_import_users_csv4: 'Öffnen der CSV-Datei unmöglich'
admin_import_users_csv5: 'Erste Importphase: '
admin_import_users_csv6: 'gefundene Eingaben!'
admin_import_users_csv7: 'Die orange erscheinenden Identifizierungscodes (logins) entsprechen den in der GRR-Basis existierenden Identifizierungscodes (logins). Die existierenden Daten werden also vernichtet und durch die in der Importdatei vorhandenen ersetzt!'
admin_import_users_csv8: ' ACHTUNG: Die blau erscheinenden Namen und Vornamen entsprechen den Benutzern, die bereits in der GRR-Basis existieren und dieselben Namen und Vornamen tragen. '
