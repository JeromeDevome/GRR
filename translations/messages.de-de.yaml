execution_automatique_backup: 'Automatische Datensicherung'
execution_automatique_backup_explications: 'Eine automatische Sicherung kann durch Ausführen des Skripts «admin_save_mysql.php» ausgelöst werden, beispielsweise indem Sie dessen Ausführung mithilfe einer «Cron» Aufgabe programmieren. Um diese Funktion zu aktivieren, müssen Sie unten ein Passwort festlegen. Wenn das Passwort beispielsweise jamesbond007 lautet, löst die URL vom Typ http://mon-site.fr/grr/admin_save_mysql.php?mdp=jamesbond007 die Sicherung aus. Es wird dringend empfohlen, ein komplexes Passwort mit Buchstaben, Zahlen und Sonderzeichen zu wählen!'
