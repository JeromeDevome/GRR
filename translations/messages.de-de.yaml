explain_area_list_format: 'Anzeigearten für die Bereiche- und Ressourcenlisten'
explain_automatic_mail: 'In bestimmten Fällen (Erstellung einer Reservierung, Löschung/Änderung, Moderation usw.) kann GRR automatisch E-Mails an bestimmte Benutzer senden. Weitere Informationen hierzu finden Sie in der Hilfe.'
explain_automatic_mail1: 'Wenn ein Benutzer eine Ressource reserviert, eine Reservierung für sich selbst (als Begünstigter) ändert oder löscht, aktivieren Sie das nebenstehende Kontrollkästchen, damit automatisch eine Bestätigungs-E-Mail versendet wird.'
explain_automatic_mail2: 'Wenn übrigens ein Benutzer eine Ressource reserviert, ändert oder eine Reservierung löscht, können bestimmte Benutzer per E-Mail verständigt werden. Für jede Ressource können Sie einen oder mehrere zu verständigende Benutzer bestimmen:'
explain_automatic_mail3: 'Wenn ein Benutzer eine Ressource reserviert, eine Reservierung im Namen eines anderen Benutzers ändert oder löscht, wird dieser (sofern das E-Mail-Feld ausgefüllt wurde) automatisch per E-Mail benachrichtigt.'
explain_backup: 'Erstellen einer kompletten Sicherungsdatei der GRR-Datenbank. Sollte es in der GRR-Datenbank Probleme geben, benutzen Sie ein Werkzeug (Tool) wie etwa PHPMYADMIN, um die Basis wiederherzustellen.'
explain_champs_recherche: 'Bei einer HTTP-Authentifizierung ist es möglich, die Namen, Vornamen und E-Mail-Adressen der Benutzer anhand der Informationen in der Tabelle $_SERVER, die vom Authentifizierungssystem übermittelt werden, abzurufen. Wenn beispielsweise $_SERVER["sn"] den Namen des Benutzers enthält, geben Sie "sn" in das erste Feld unten ein. Geben Sie ebenfalls "givenName" in der zweiten Zeile ein, wenn $_SERVER["givenName"] den Vornamen enthält, und geben Sie "mail" in der dritten Zeile ein, wenn $_SERVER["mail"] die E-Mail-Adresse enthält.'
explain_css: 'Stil- und Themenwahl'
explain_default_area_and_room: 'Standardbereich und -ressource'
explain_default_area_and_room_and_site: 'Standardstandort, -domäne und -ressource'
explain_default_parameter: 'Wählen Sie in diesem Bereich die Standardanzeige der Empfangsseite. Diese Parameter werden eingesetzt, wenn der Benutzer nicht selbst Standardanzeigeparameter gewählt hat.'
explain_disable_login: 'Indem Sie Ihre Verbindungen deaktivieren, machen Sie die Verbindung mit der Webseite für andere Benutzer unmöglich, außer für die Administratoren. Außerdem werden die zur Zeit verbundenen Benutzer automatisch ausgeloggt. Auch wenn die Netzverbindung für den Zugang zur Webseite nicht obligatorish ist, bleibt dieser Zugang dennoch möglich.'
explain_horaire_autorise: 'Sie können die Verbindung zu GRR auf bestimmte Zeiten beschränken. Lassen Sie das Feld leer, um die Verbindung nicht auf bestimmte Zeiten zu beschränken, oder geben Sie den zulässigen Zeitbereich ein (Format HH:MM). Administratoren sind von dieser Einschränkung nicht betroffen.'
explain_ip_autorise: 'Begrenzt die Verbindung von Benutzern über eine IP-Adresse (außer Administratoren). Wenn GRR gehostet wird, geben Sie bitte eine öffentliche IP-Adresse an, andernfalls die interne IP-Adresse. Trennen Sie die verschiedenen IP-Adressen durch Semikolons.'
explain_max_booking: 'Die Beschränkung gilt nicht für die möglichen Verwalter der Ressource.'
explain_multisite: 'Ermöglicht das Verwalten einer zusätzlichen Ebene. Domains sind an Sites angehängt.'
explain_restore: 'Im Falle eines Datenverlusts oder eines Problems mit der GRR-Datenbank ermöglicht Ihnen diese Funktion, diese im vorherigen Sicherungszustand wiederherzustellen. Sie müssen eine Datei auswählen, die mit der Funktion „Sicherung starten“ erstellt wurde.'
explain_session_max_length: 'Diese Dauer zeigt die maximale Inaktivitätszeit an, nach der ein Benutzer automatisch ausgeloggt wird.'
explication_champs_additionnels: 'Auf dieser Seite können Sie zusätzliche Felder Domäne um Domäne festlegen. Diese Felder werden im Formular als fakultative Felder erscheinen.'
explication_debut_Jours_Cycles: 'Bei der Erstellung des Kalenders "Zyklustage" Nummer des ersten Tages des ersten gültigen Datums.'
explication_Jours_Cycles1: 'Die folgenden Parameter werden beim Erstellen oder Neugenerieren des Kalenders für "Zyklustage" verwendet. Wenn Sie Parameter auf dieser Seite ändern, werden diese daher nur berücksichtigt, wenn Sie den Kalender „Zyklustage” erstellen oder neu generieren..'
explication_Jours_Cycles2: 'Sobald der Kalender erstellt ist, können Sie die Zuweisung der Zyklustage für jedes Datum im Kalender manuell ändern.'
explication_Jours_Cycles3: 'Im untenstehenden Kalender finden Sie unter jedem Datum die Nummer des entsprechenden "Zyklustages". Durch Anklicken des Links können Sie die Zuordnung eines "Zyklustages" löschen oder ändern. Sie können auch einen Text anstelle einer Nummer zuweisen.'
explication_Jours_Cycles4: 'Auf der vorherigen Registerkarte haben Sie auch die Möglichkeit, schnell einen Kalender mit "Zyklustagen" zu erstellen oder neu zu generieren und anschließend die so erstellten "Zyklustage" manuell zu ändern.'
explications_active_type: 'Anmerkung: wenn eine Art nicht angeklickt wurde, kann sie vom Benutzer nicht mehr gewählt werden, aber die bereits getätigten Reservierungen erscheinen weiterhin auf der Übersicht mit der Reservierungsart.'
Explications_des_Parametres_configuration_envoi_automatique_mails: 'GRR verwendet PHPMailer zum Versenden von E-Mails. PHPMailer bietet zwei Versandmethoden: 1) Die Methode „SMTP“ für die Verbindung mit einem Remote-Mailserver; 2) Die Methode „Mail“, wenn der Mailserver lokal ist. Die Methode „SMTP“ kann auch mit einem lokalen Server verwendet werden, die Methode „Mail“ ist jedoch aufgrund ihrer Geschwindigkeit vorzuziehen.'
Explications_methode_mail_1: 'Mail Server'
Explications_methode_smtp_1: 'SMTP Server'
Explications_methode_smtp_2: 'Wenn die SMTP-Methode gewählt wurde und der Server eine Authentifizierung erfordert, geben Sie bitte Benutzernamen und Passwort an.'
explications_signaler_reservation_en_cours: 'Es ist möglich, anzugeben, dass eine Ressource ausgeliehen ist (wenn es sich um Material handelt). Durch Anklicken der zweiten oder dritten Option gibt der Verwalter an, dass die Ressource ausgeliehen ist und daher nicht zurückgegeben wurde. Wenn die Ressource zurückgegeben wurde, darf der Verwalter nicht vergessen, die Option Nr. 1 unten auszuwählen.'
Explications_suppression_automatique_des_reservations: ' Die Aktivierung bestimmter Funktionen von GRR erfordert die Möglichkeit, Aufgaben automatisch auszuführen. Beispiele hierfür sind das automatische Löschen bestimmter Reservierungen im Falle von „vorbehaltlichen Reservierungen” oder das Versenden einer Benachrichtigung über eine Verspätung, wenn eine Ressource nicht zurückgegeben wurde. Um diese automatischen Löschaufgaben auszuführen, gibt es zwei mögliche Konfigurationen, die jeweils Vor- und Nachteile haben. Weitere Informationen finden Sie in der Hilfe.'
