admin_purge_accounts_confirm4: 'ATTENTION : Cette action va effacer tous les utilisateurs externes à GRR, sauf les administrateurs généraux et les utilisateurs ayant des privilèges. Les réservations associées à ces comptes ne seront pas supprimées. Etes-vous certain de vouloir effectuer cette action ?'
admin_purge_accounts_desc: "Les actions ci-dessous permettent de supprimer tous les comptes utilisateurs qui ont été ajoutés via une source externe à GRR et qui ne sont pas administrateurs généraux, ainsi que, selon l'option choisie, toutes les réservations associées.\r\nAttention, ces actions sont irréversibles, soyez bien certain de vouloir effectuer cette suppression. Faites une sauvegarde de la base de données au préalable\r\n\r\nRemarque : veillez à effectuer cette opération sans utilisateur connecté à GRR (hormis l'administrateur).\r\nRappel : vous pouvez désactiver temporairement les connexions à GRR (menu \"configuration générale\")."
