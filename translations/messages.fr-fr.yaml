explain_area_list_format: "Type d'affichage des listes des domaines et des ressources"
explain_automatic_mail: "Dans un certain nombres de cas (création d'une réservation, suppression/modification, modération, ...), GRR peut envoyer automatiquement des mails à certains utilisateurs. Consultez l'aide pour en savoir plus à ce sujet."
explain_automatic_mail1: "Lorsqu'un utilisateur réserve une ressource, modifie ou bien supprime une réservation pour lui-même (dont il est bénéficiaire), cochez la case ci-contre pour qu'un email de confirmation soit systématiquement envoyé."
explain_automatic_mail2: "Par ailleurs, lorsqu'un utilisateur réserve une ressource, modifie ou bien supprime une réservation, certains utilisateurs peuvent être prévenus par e-mail. Pour chaque ressource, vous pouvez désigner un ou plusieurs utilisateurs à prévenir :"
explain_automatic_mail3: "Lorsqu'un utilisateur réserve une ressource, modifie ou bien supprime une réservation au nom d'un autre utilisateur, ce dernier (si le champ email a été renseigné) en est averti automatiquement par un message e-mail."
explain_backup: 'Création d''un fichier de sauvegarde complet de la base GRR. En cas de problème sur la base GRR, utilisez la fonction "Restaurer_la_sauvegarde".'
explain_champs_recherche: "Dans le cas d'une authentification HTTP, il est possible de tenter de récupérer les noms, prénoms et adresses email des utilisateurs grâce aux informations contenues dans le tableau $_SERVER et transmises par le système d'authentification.\r\n\r\nPar exemple, si $_SERVER[\"sn\"] contient le nom de l'utilisateur, indiquer \"sn\" dans le premier champ ci-dessous. De même indiquez \"givenName\" dans la deuxième ligne si $_SERVER[\"givenName\"] contient le prénom et indiquez \"mail\" dans la troisième ligne si $_SERVER[\"mail\"] contient le mail."
explain_css: 'Choix du style/thème'
explain_default_area_and_room: 'Domaine et ressource par défaut'
explain_default_area_and_room_and_site: 'Site, domaine et ressource par défaut'
explain_default_parameter: "Choisissez dans cette rubrique, l'affichage par défaut de la page d'accueil. Ce sont les paramètres qui s'appliqueront si l'utilisateur n'a pas lui-même choisi des paramètres d'affichage par défaut."
explain_disable_login: "En désactivant les connexions, vous rendez impossible la connexion au site pour les utilisateurs, hormis les administrateurs. De plus, les utilisateurs actuellement connectés sont automatiquement déconnectés. Néanmoins, si la connexion n'est pas obligatoire pour l'accès au site en visualisation, cet accès reste possible."
explain_horaire_autorise: 'Vous pouvez restreindre la connexion à GRR entre certains horaires. Laissez vide pour ne pas restreindre la connexion à des horaires ou saisissez la plage horaire autorisée (Format HH:MM). Les administrateurs ne sont pas impactés par cette restriction.'
explain_ip_autorise: 'Limite la connexion des utilisateurs via une iP (hors administrateurs). Si GRR est hébergé, veuillez mettre une iP publique sinon les iP interne. Séparez les différentes iP par des points virgules.'
explain_max_booking: "La restriction ne s'applique pas aux gestionnaires de la ressource."
explain_multisite: 'Permet de gérer un niveau supplémentaire. Les domaines sont attachés à des sites.'
explain_restore: "En cas de perte de donnée ou de problème sur la base GRR, cette fonction vous permet de la retrouver dans l'état antérieur lors d'une sauvegarde. Vous devez sélectionner un fichier créé à l'aide de la fonction \"Lancer une sauvegarde\"."
explain_session_max_length: "Cette durée indique le temps maximum d'inactivité au bout duquel un utilisateur est automatiquement déconnecté."
explication_champs_additionnels: 'Sur cette page, vous avez la possibilité de définir, domaine par domaine, des champs additionnels de votre choix et qui apparaîtront dans les formulaires de saisie des réservations comme autant de champs supplémentaires.'
explication_debut_Jours_Cycles: 'Lors de la création du calendrier "jours cycles", numéro du premier jour de la première date valide.'
explication_Jours_Cycles1: 'Les paramètres suivants sont utilisés lors de la création ou la régénération du calendrier des "jours cycle". Si vous modifiez des paramètres sur cette page, ils ne seront donc pris en compte que si vous créez ou régénérez le calendrier "jours cycles".'
explication_Jours_Cycles2: "Une fois le calendrier généré, vous pouvez modifier manuellement l'affectation des jours cycle pour chaque date du calendrier"
explication_Jours_Cycles3: 'Dans le calendrier ci-dessous, en dessous de chaque date figure le numéro du "jour cycle" correspondant. En cliquant sur le lien, vous pouvez supprimer ou modifier l''affectation d''un "jour cycle". Vous pouvez également affecter une texte plutôt qu''un numéro.'
explication_Jours_Cycles4: 'Vous avez également la possibilité, dans l''onglet précédent, de créer ou régénérer rapidement un calendrier de "jours cycle", puis de modifier manuellement les "jours cycle" ainsi générés.'
explications_active_type: "Remarque : quand un type est décoché, celui-ci n'est plus proposé à l'utilisateur effectuant ou modifiant une réservation, mais les réservations déjà effectuées continuent d'apparaître sur les plannings avec ce type, bien que désactivé."
Explications_des_Parametres_configuration_envoi_automatique_mails: "GRR utilise PHPMailer pour l'envoi de mails. Avec PHPMailer, il y a deux méthodes pour envoyer des mails :\r\n1) La méthode \"smtp\" permettant de se connecter à un serveur de mail distant ;\r\n2) La méthode \"mail\" lorsque le serveur de mail est local.\r\nLa méthode \"smtp\" peut également être utilisée avec un serveur local mais il est préférable de privilégier la méthode \"mail\" avec un serveur local car elle est plus rapide."
Explications_methode_mail_1: 'Serveur Mail'
Explications_methode_smtp_1: 'Serveur SMTP'
Explications_methode_smtp_2: 'Si la méthode "smtp" est choisie et que le serveur nécessite une authentification, précisez les nom d''utilisateur et mot de passe.'
explications_signaler_reservation_en_cours: "Il est possible de signaler qu'une ressource est empruntée. En cochant la 2ème ou la 3ème option, le gestionnaire signale que la ressource est empruntée et n'est donc pas restituée."
Explications_suppression_automatique_des_reservations: "L'activation de certaines fonctionnalités de GRR nécessite la possibilité de mettre en place l'exécution automatiques de tâches.\r\nPar exemple la suppression automatique de certaines réservations dans le cas des « réservations sous réserve », ou encore l'envoi d'une notification de retard en cas de non restitution d'une ressource.\r\nPour effectuer ces tâches automatiques de suppression, il y a deux configurations possibles, chacune ayant ses inconvénients et ses avantages. Consultez l'aide pour plus de détail."
