admin_purge_accounts_confirm: '¡ATENCIÓN: esta acción va a borrar todos los usuarios (excepto los administradores generales), externos a GRR y sus privilegios. Las reservas asociadas a estas cuentas no serán suprimidas. ¿Está seguro de querer efectuar esta acción?'
