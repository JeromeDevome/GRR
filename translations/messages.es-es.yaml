admin_import_users_csv12: '¡Se creó el usuario!'
admin_import_users_csv2: "\r\nEl fichero de importación debe ser al formato csv (separador: punto y coma, codificación: UTF-8)\r\nEl fichero debe contener los distintos campos siguiente :\r\n--> Identificador : el identificador del usuario\r\n--> Apellido\r\n--> Nombre\r\n--> Contraseña\r\n--> Dirección e-mail\r\n--> Tipo de usuario: tres valores autorizados : \"visitador\", \"usuario\", \"administrador\"\r\n--> Estatuto : dos valores autorizados:\"activo\" o \"inactivo\"\r\n--> Tipo de autentificación: dos valores autorizados: \"local\" o \"ext\"\r\n--> Cambio de contraseña en la próxima conexión: dos valores autorizados: \"0\" = no o \"1\" = sí\r\n"
admin_import_users_csv3: "\r\n\r\nALGUNAS PRECISIONES :\r\n\r\nIdentificador\r\n20 caracteres como máximo. Se puede tratar de cualquier secuencia de caracteres y/o de cifras sin espacio. El carácter _ está también autorizado. Si este formato no se respeta, la secuencia de carácter ??? aparece al lugar del identificador. Los identificadores que aparecen en rojo corresponden a apellidos de usuarios ya existentes en la base GRR. ¡Entonces los datos existentes serán aplastados por los datos presentes en el fichero importado!\r\n\r\nApellido\r\nApellido del usuario. 30 caracteres como máximo. Puede tratarse de cualquier secuencia de caracteres y/o de cifras con espacios y apóstrofes eventualmente .\r\n\r\nNombre\r\nNombre del usuario. Misma observación que para el apellido. Los apellidos y los nombres que aparecen en azul coresponden a usuarios que existen en la base GRR y que llevan los mismos apellidos y nombres.\r\n\r\nContraseña\r\nDejar vacio por si el tipo de autentificación es \"ext\". Sino %pass_leng% caracteres mínimo y 30 caracteres al máximo.\r\n\r\nDirección e-mail\r\n100 caracteres como máximo. Poner el símbolo \"-\"si no hay una dirección e-mail\r\n\r\n\r\nTipo de autentificación\r\nPoner \"local\" en el caso general y \"ext\" si se trata de un usuario conectándose por el intermediario de un anuario ldap, o de un sistema de autentificación (CAS, LemonLdap, ...)\r\n\r\n"
admin_import_users_csv4: 'Imposible abrir el fichero CSV'
admin_import_users_csv5: 'Primera fase de importación: '
admin_import_users_csv6: '¡entradas detectadas!'
admin_import_users_csv7: 'Las claves de acceso que aparecen en naranja corresponden a claves de acceso ya existentes en la base GRR. ¡Por lo tanto, los datos existentes estarán aplastados por los datos presentes en el fichero que hay que importar!'
admin_import_users_csv8: "\r\nCUIDADO : los apellidos y nombres que aparecen en azul corresponden a usuarios que ya existen en la base GRR y llevando los mismos apellidos y nombres.\r\n\r\n"
