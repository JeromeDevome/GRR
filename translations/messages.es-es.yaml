admin_purge_accounts_confirm4: '¡ATENCIÓN: esta acción va a borrar todos los usuarios externos a GRR, salvo los administradores generales y los usuarios teniendo privilegios. Las reservas asociadas a estas cuentas no serán suprimidas. ¿Está seguro de querer efectuar esta acción?'
admin_purge_accounts_desc: "Las acciones más abajo permiten suprimir todas las cuentas de usuario que han sido añadidas vía una fuente externa a GRR y que no son administradores generales, así como, según la opción elegida, todas las reservas asociadas.\r\nAtención, estas acciones son irreversibles, sea bien cierto de querer efectuar esta supresión. Haga una copia de seguridad de la base de datos previamente\r\n\r\nObservación : vele por efectuar esta operación sin usuario conectado a GRR (salvo el administrador).\r\nRecordatorio : puede desactivar temporalmente las conexiones a GRR (menú \"configuración general\")."
