execution_automatique_backup_explications: "Una copia de seguridad automática puede ser activada por la ejecución del script « admin_save_mysql.php », por ejemplo programando su ejecución con una tarea « cron ».\r\nPara activar esta funcionalidad, debe definir más abajo una contraseña.\r\nPor ejemplo, si la contraseña es jamesbond007, la URL del tipo : http://mon-site.fr/grr/admin_save_mysql.php?mdp=jamesbond007 activará la copia de seguridad.\r\nSe recomienda encarecidamente elegir una contraseña compleja con letras, cifras y caracteres especiales !"
