explain_area_list_format: 'Tipo de visualización de las listas de los campos y recursos '
explain_automatic_mail: 'En ciertos casos (creación de una reserva, supresión, modificación, moderation,...), GRR puede enviar mails automáticamente a ciertos usuarios. Consulte la ayuda para saber más.'
explain_automatic_mail1: 'Cuando un usuario reserva un recurso, modifica o suprime una reserva para él mismo (de la cual es beneficiario), marca la casilla al lado para que un mail de confirmación sea sistemáticamente enviado.'
explain_automatic_mail2: 'Por otra parte, cuando un usuario reserva un recurso, modifica o suprime una reservación, algunos usuarios pueden ser avisados por e-mail. Para cada recurso, usted puede nombrar a uno o más usuarios por avisar :'
explain_automatic_mail3: 'Cuando un usuario reserva un recurso, modifica o suprime una reserva en nombre de otro usuario, este último (si el campo email ha sido rellenado) está advertido por un correo electrónico.'
explain_backup: 'Creación de un fichero de protección completo de la base GRR. En caso de problema sobre la base GRR, utilizar una herramienta como PHPMYADMIN para restaurar la base.'
explain_champs_recherche: "En el caso de una autentificación HTTP, es posible intentar recuperar los apellidos, nombres y direcciones email de los usuarios gracias a las informaciones contenidas en el array $_SERVER y transmitidas por el sistema de autentificación.\r\n\r\nPor ejemplo, si $_SERVER[\"sn\"] contiene el apellido del usuario, indicar \"sn\" en el primer campo más abajo. Del mismo modo indique \"givenName\" en la segunda línea si $_SERVER[\"givenName\"] contiene el nombre e indique \"mail\" en la tercera línea si $_SERVER[\"mail\"] contiene el email."
explain_css: 'Elección del estilo/tema'
explain_default_area_and_room: 'Campo y recurso por defecto'
explain_default_area_and_room_and_site: 'Sitio, campo y recurso por defecto'
explain_default_parameter: 'Elija en esta rúbrica, la visualización por defecto de la página inicial. Son los parámetros que se aplicarán si el propio usuario no eligió parámetros de visualización por defecto.'
explain_disable_login: 'Desactivando las conexiones, usted hace que la conexión al sitio para los usuarios sea imposible, excepto para los administradores. Además, los usuarios actualmente conectados están desconectados automáticamente. Sin embargo, si la conexión no es obligatoria para el acceso al sitio en visualización, este acceso sigue siendo posible.'
explain_horaire_autorise: 'Puede restringir la conexión a GRR entre ciertos horarios. Deje vacío para no restringir la conexión a horarios o introduzca la franja horaria autorizada (Formato HH:MM). Los administradores no están afectados por esta restricción.'
explain_ip_autorise: 'Limita la conexión de los usuarios vía IP (excepto administradores). Si GRR está alojado, por favor ponga una IP pública sino las IPs internas. Separe las diferentes IPs por puntos y coma'
explain_max_booking: 'La restricción no se aplica a los gestores del recurso.'
explain_multisite: 'Le permite administrar un nivel adicional. Los dominios se adjuntan a los sitios.'
explain_restore: 'En caso de pérdida de datos o problema con la base de datos GRR, esta función permite restaurarla a su estado anterior durante una copia de seguridad. Debe seleccionar un archivo creado con la función "Iniciar copia de seguridad".'
explain_session_max_length: 'Esta duración indica el tiempo máximo de inactividad al final del cual un usuario está desconectado automáticamente.'
explication_champs_additionnels: 'Sobre esta página, usted tiene la posibilidad de definir, campo por campo, campos adicionales de su elección que aparecerán en los formularios de entrada de las reservas como tantos campos suplementarios facultativos.'
explication_debut_Jours_Cycles: 'En el momento de la creación del calendario "días ciclos", número del primer día de la primera fecha válida.'
explication_Jours_Cycles1: ' Los parámetros siguientes son utilizados en el momento de la creación o la regeneración del calendario de los "días ciclo". Si usted modifica parámetros sobre esta página, sólo estarán tomados en cuenta entonces si usted crea o regenera el calendario "días ciclos".'
explication_Jours_Cycles2: 'Una vez el calendario generado, puede modificar manualmente la afectación de los días ciclo para cada fecha del calendario'
explication_Jours_Cycles3: 'En el calendario más abajo, debajo de cada fecha figura el número del "día ciclo" correspondiente. Hagando clic en el enlace, puede suprimir o modificar la afectación de un "día ciclo". Puede también afectar un texto en lugar de un número.'
explication_Jours_Cycles4: 'Tiene también la posibilidad, en la pestaña precedente, de crear o regenerar rápidamente un calendario de "días ciclo", y de modificar manualmente los "días ciclos" así generados.'
explications_active_type: 'Observación: cuando un tipo ya no está punteado, este ya no se propone al usuario efectuando o modificando una reserva, pero las reservas ya efectuadas siguen apareciendo en las planifaciones con este tipo, a pesar de estar desactivado.'
Explications_des_Parametres_configuration_envoi_automatique_mails: "GRR usa PHPMailer para el envío de correos electrónicos. Con PHPMailer, hay dos métodos para enviar mails:\r\n1) El método \"smtp\" permitiendo de conectarse a un servidor de mail lejano;\r\n2) El método \"mail\" cuando el servidor de mail es local.\r\nEl método \"smtp\" puede también ser utilizado con un servidor local pero es preferible privilegiar la méthode \"mail\" con un servidor local porque es más rápida.."
Explications_methode_mail_1: 'Servidor Mail'
Explications_methode_smtp_1: 'Servidor SMTP'
Explications_methode_smtp_2: 'Si el método "smtp" es elegido y que ele servidor necesita una autentificación, indicar el nombre de usuario y la contraseña.'
explications_signaler_reservation_en_cours: 'Se puede señalar cuando un recurso ha sido prestado (si el recurso es un material). Marcando la segunda o la tercera opción, el gestor señala que el recurso está prestado y no ha sido devuelto. Cuando el recurso ha sido restituido, el gestor no debe olvidar seleccionar la opción n° 1 más abajo.'
Explications_suppression_automatique_des_reservations: "La activación de algunas funcionalidades de GRR necesita la posibilidad de establecer la execución automática de tareas.\r\nPor ejemplo la supresión automática de ciertas reservas en el caso de las \"reservas sin garantía\", o también el envío de una notificación de retraso en caso de no restitución de un recurso.\r\nPara efectuar estas tareas automáticas de supresión, hay dos configuraciones posibles, cada una teniendo sus inconvenientes y sus ventajas. Consulte la ayuda para más detalles."
