admin_purge_accounts_confirm: 'ATTENZIONE: Questa azione cancellerà tutti gli utenti (tranne gli amministratori generali) esterni a GRR e i loro privilegi. Le prenotazioni associate a questi account non verranno rimosse. Sei sicuro di voler eseguire questa azione?'
