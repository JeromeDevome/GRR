execution_automatique_backup: 'Esecuzione automatica del backup'
execution_automatique_backup_explications: "Un backup automatico può essere attivato dall'esecuzione dello script « admin_save_mysql.php », ad esempio programmando la sua esecuzione tramite un'attività « cron ».\r\nPer attivare questa funzionalità, è necessario definire una password qui sotto.\r\nAd esempio, se la password è jamesbond007, l'URL del tipo: http://mio-sito.it/grr/admin_save_mysql.php?mdp=jamesbond007 attiverà il backup.\r\nSi consiglia vivamente di scegliere una password complessa con lettere, cifre e caratteri speciali!"
execution_automatique_backup_mdp: "Password utilizzata per l'esecuzione dello script « admin_save_mysql.php »"
explain_area_list_format: 'Tipo di visualizzazione delle liste dei domini e delle risorse'
explain_automatic_mail: 'In un certo numero di casi (creazione di una prenotazione, cancellazione/modifica, moderazione, ...), GRR può inviare automaticamente email ad alcuni utenti. Consultare la guida per saperne di più a questo proposito.'
explain_automatic_mail1: "Quando un utente prenota una risorsa, modifica o cancella una prenotazione per se stesso (di cui è beneficiario), seleziona la casella a fianco affinché venga sistematicamente inviata un'email di conferma."
explain_automatic_mail2: 'Inoltre, quando un utente prenota una risorsa, modifica o cancella una prenotazione, alcuni utenti possono essere avvisati via email. Per ogni risorsa, è possibile designare uno o più utenti da avvisare:'
explain_automatic_mail3: "Quando un utente prenota una risorsa, modifica o cancella una prenotazione a nome di un altro utente, quest'ultimo (se il campo email è stato compilato) viene avvisato automaticamente tramite un messaggio email."
explain_backup: 'Creazione di un file di backup completo del database GRR. In caso di problemi sul database GRR, utilizzare la funzione "Restaurare il backup".'
explain_champs_recherche: "Nel caso di un'autenticazione HTTP, è possibile tentare di recuperare i cognomi, i nomi e gli indirizzi email degli utenti grazie alle informazioni contenute nell'array $_SERVER e trasmesse dal sistema di autenticazione.\r\n\r\nAd esempio, se $_SERVER[\"sn\"] contiene il cognome dell'utente, indicare \"sn\" nel primo campo qui sotto. Allo stesso modo indicare \"givenName\" nella seconda riga se $_SERVER[\"givenName\"] contiene il nome e indicare \"mail\" nella terza riga se $_SERVER[\"mail\"] contiene l'email."
explain_css: 'Scelta dello stile/tema'
explain_default_area_and_room: 'Dominio e risorsa predefiniti'
explain_default_area_and_room_and_site: 'Sito, dominio e risorsa predefiniti'
explain_default_parameter: "Scegliere in questa sezione la visualizzazione predefinita della home page. Questi sono i parametri che si applicheranno se l'utente non ha scelto personalmente dei parametri di visualizzazione predefiniti."
explain_disable_login: "Disabilitando le connessioni, rendi impossibile la connessione al sito per gli utenti, tranne che per gli amministratori. Inoltre, gli utenti attualmente connessi vengono disconnessi automaticamente. Tuttavia, se la connessione non è obbligatoria per l'accesso al sito in visualizzazione, tale accesso rimane possibile."
explain_horaire_autorise: 'È possibile limitare la connessione a GRR tra determinati orari. Lasciare vuoto per non limitare la connessione a degli orari o inserire la fascia oraria consentita (Formato HH:MM). Gli amministratori non sono interessati da questa restrizione.'
explain_ip_autorise: 'Limita la connessione degli utenti tramite un IP (esclusi gli amministratori). Se GRR è ospitato, inserire un IP pubblico, altrimenti gli IP interni. Separare i diversi IP con punti e virgola.'
explain_max_booking: 'La restrizione non si applica ai gestori della risorsa.'
explain_multisite: 'Consente di gestire un livello supplementare. I domini sono collegati ai siti.'
explain_restore: 'In caso di perdita di dati o di un problema con il database GRR, questa funzione consente di ripristinarlo allo stato precedente utilizzando un backup. È necessario selezionare un file creato tramite la funzione "Avvia backup".'
explain_session_max_length: 'Questa durata indica il tempo massimo di inattività dopo il quale un utente viene disconnesso automaticamente.'
explication_champs_additionnels: 'In questa pagina è possibile definire, dominio per dominio, dei campi aggiuntivi a scelta che appariranno nei moduli di inserimento delle prenotazioni come ulteriori campi facoltativi.'
explication_debut_Jours_Cycles: 'Durante la creazione del calendario "giorni cicli", numero del primo giorno della prima data valida.'
explication_Jours_Cycles1: 'I seguenti parametri vengono utilizzati durante la creazione o la rigenerazione del calendario dei "giorni ciclo". Se si modificano i parametri in questa pagina, verranno presi in considerazione solo se si crea o si rigenera il calendario "giorni ciclo".'
explication_Jours_Cycles2: "Una volta generato il calendario, è possibile modificare manualmente l'assegnazione dei giorni ciclo per ogni data del calendario."
explication_Jours_Cycles3: 'Nel calendario qui sotto, sotto ogni data figura il numero del "giorno ciclo" corrispondente. Cliccando sul link, è possibile eliminare o modificare l''assegnazione di un "giorno ciclo". È inoltre possibile assegnare un testo anziché un numero.'
explication_Jours_Cycles4: 'È inoltre possibile, nella scheda precedente, creare o rigenerare rapidamente un calendario di "giorni ciclo", per poi modificare manualmente i "giorni ciclo" così generati.'
explications_active_type: "Nota: quando un tipo viene deselezionato, questo non viene più proposto all'utente che effettua o modifica una prenotazione, ma le prenotazioni già effettuate continuano ad apparire sui planning con quel tipo, sebbene disabilitato."
Explications_des_Parametres_configuration_envoi_automatique_mails: "GRR utilizza PHPMailer per l'invio di email. Con PHPMailer, esistono due metodi per l'invio di email:\r\n\r\n1) Il metodo \"smtp\", che consente di connettersi a un server di posta remoto;\r\n\r\n2) Il metodo \"mail\", quando il server di posta è locale.\r\nIl metodo \"smtp\" può essere utilizzato anche con un server locale, ma è preferibile utilizzare il metodo \"mail\" perché è più veloce."
Explications_methode_mail_1: 'Server Mail'
Explications_methode_smtp_1: 'Server SMTP'
Explications_methode_smtp_2: 'Se si sceglie il metodo "smtp" e il server richiede l''autenticazione, specificare nome utente e password.'
explications_signaler_reservation_en_cours: 'È possibile segnalare che una risorsa è in prestito. Selezionando la 2ª o la 3ª opzione, il gestore segnala che la risorsa è in prestito e non è quindi stata restituita.'
Explications_suppression_automatique_des_reservations: "L'attivazione di alcune funzionalità di GRR richiede la possibilità di impostare l'esecuzione automatica di attività.\r\nAd esempio la cancellazione automatica di alcune prenotazioni nel caso delle « prenotazioni con riserva », o ancora l'invio di una notifica di ritardo in caso di mancata restituzione di una risorsa.\r\nPer eseguire queste attività automatiche di cancellazione, ci sono due configurazioni possibili, ognuna con i suoi svantaggi e vantaggi. Consultare la guida per maggiori dettagli."
