admin_import_users_csv12: "L'utente è stato creato!"
admin_import_users_csv2: "\r\nIl file di importazione deve essere in formato csv (separatore: punto e virgola, codifica: UTF-8)\r\nIl file deve contenere i seguenti campi:\r\n--> Identificativo: l'identificativo dell'utente\r\n--> Cognome\r\n--> Nome\r\n--> Password\r\n--> Indirizzo email\r\n--> Tipo di utente: tre valori ammessi: \"visiteur\", \"utilisateur\", \"administrateur\"\r\n--> Stato: due valori ammessi: \"actif\" o \"inactif\"\r\n--> Tipo di autenticazione: due valori ammessi: \"local\" o \"ext\"\r\n--> Cambio password alla prossima connessione: due valori ammessi: \"0\" = no o \"1\" = sì\r\n"
admin_import_users_csv3: "\r\nALCUNE PRECISAZIONI:\r\n\r\nIdentificativo\r\nMassimo 40 caratteri. Può essere qualsiasi sequenza di caratteri e/o cifre senza spazi. Anche il carattere _ è consentito. Se questo formato non viene rispettato, apparirà la sequenza ??? al posto dell'identificativo. Gli identificativi che appaiono in rosso corrispondono a nomi utente già esistenti nel database GRR. I dati esistenti verranno quindi sovrascritti dai dati presenti nel file importato!\r\n\r\nCognome\r\nCognome dell'utente. Massimo 30 caratteri. Può essere qualsiasi sequenza di caratteri e/o cifre con eventuali spazi e apostrofi.\r\n\r\nNome\r\nNome dell'utente. Stessa nota del cognome. I nomi e i cognomi che appaiono in blu corrispondono a utenti esistenti nel database GRR con lo stesso nome e cognome.\r\n\r\nPassword\r\nLasciare vuoto se il tipo di autenticazione è \"ext\". Altrimenti, minimo %pass_leng% caratteri e massimo 30 caratteri.\r\n\r\nIndirizzo Email\r\nMassimo 100 caratteri. Inserire il simbolo \"-\" se non è presente l'indirizzo email\r\n\r\nTipo di autenticazione\r\nInserire \"local\" nel caso generale e \"ext\" se si tratta di un utente che si connette tramite una directory LDAP o un sistema di autenticazione (CAS, LemonLdap, ...)\r\n\r\n"
admin_import_users_csv4: 'Impossibile aprire il file CSV'
admin_import_users_csv5: "Prima fase dell'importazione:"
admin_import_users_csv6: 'voci rilevate!'
admin_import_users_csv7: 'I login che appaiono in arancione corrispondono a login già esistenti nel database GRR. I dati esistenti verranno quindi sovrascritti dai dati presenti nel file da importare!'
admin_import_users_csv8: "\r\nATTENZIONE : i nomi e nomi che appaiono in blu corrispondono ad utenti che esistono già nella base GRR e che portano gli stessi nomi e nomi.\r\n\r\n"
admin_import_users_csv9: "I simboli ??? indicano che il campo in questione non è valido. L'operazione di importazione dei dati non può continuare normalmente. Correggere il file da importare."
