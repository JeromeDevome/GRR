admin_purge_accounts_confirm4: 'ATTENZIONE: Questa azione cancellerà tutti gli utenti esterni a GRR, tranne gli amministratori generali e gli utenti con privilegi. Le prenotazioni associate a questi account non verranno rimosse. Sei sicuro di voler eseguire questa azione?'
admin_purge_accounts_desc: "Le azioni seguenti consentono di cancellare tutti gli account utente aggiunti tramite una fonte esterna a GRR e che non sono amministratori generali, nonché, a seconda dell'opzione scelta, tutte le prenotazioni associate.\r\nAttenzione, queste azioni sono irreversibili, assicurati di voler procedere con questa cancellazione. Effettua preventivamente un backup del database\r\n\r\nNota: assicurati di eseguire questa operazione senza utenti connessi a GRR (tranne l'amministratore).\r\nPromemoria: puoi disabilitare temporaneamente le connessioni a GRR (menu \"configurazione generale\")."
