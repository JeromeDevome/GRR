admin_calendar_explain_1: "Questa procedura consente di prenotare o liberare molto rapidamente fasce orarie simultaneamente su più risorse di più domini e secondo un calendario.\r\n\r\nEsempio: è possibile bloccare per l'anno determinati giorni come i fine settimana, le vacanze, i giorni festivi...\r\nAttenzione: in caso di conflitto con prenotazioni esistenti, queste saranno automaticamente e irrimediabilmente eliminate a favore della nuova prenotazione. Inoltre, le persone interessate dalle eliminazioni non saranno avvisate via email.\r\n\r\nQuesta procedura si svolge in tre fasi:\r\nScelta del/i dominio/i e del tipo di azione\r\nScelta delle risorse da prenotare, nome, descrizione e tipo di prenotazioni\r\nScelta delle date e degli orari da prenotare su un calendario\r\nLe modifiche effettive alle prenotazioni avvengono solo al termine della terza fase."
